name: Build SD card image

# Run by hand (Actions tab -> "Build SD card image" -> "Run workflow"),
# or automatically when you publish a release.
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the signing key is set up
        run: |
          if grep -q "REPLACE" keys/release.pub; then
            echo "::error::keys/release.pub still has the placeholder. Run 'python tools/keygen.py' on your computer first (see INSTALL.md)."
            exit 1
          fi

      - name: Prepare Bouncer files for the image
        run: |
          pip install aiohttp dnslib
          # Uploads through the GitHub website lose the "executable" mark;
          # the image builder skips scripts without it.
          chmod +x image/stage-bouncer/prerun.sh image/stage-bouncer/00-bouncer/*.sh
          F=image/stage-bouncer/00-bouncer/files
          mkdir -p "$F/app" "$F/lists"
          cp -r bouncer VERSION "$F/app/"
          find "$F/app" -name "__pycache__" -prune -exec rm -rf {} +
          cp keys/release.pub "$F/release.pub"
          echo "{\"repo\": \"${{ github.repository }}\"}" > "$F/update.json"
          cp -r system "$F/system"
          # A first copy of the block lists, so Bouncer blocks from its very first minute.
          BOUNCER_STATE_DIR="$PWD/build-state" python -m bouncer update-lists || true
          cp build-state/lists/* "$F/lists/" 2>/dev/null || true
          ls -la "$F" "$F/lists"

      - name: Create a random password for the hidden system user
        id: pw
        run: |
          PW="$(openssl rand -base64 24)"
          echo "::add-mask::$PW"
          echo "pw=$PW" >> "$GITHUB_OUTPUT"

      - name: Build the image (takes 30-60 minutes)
        uses: usimd/pi-gen-action@v1
        id: build
        with:
          image-name: bouncer-${{ github.event.release.tag_name || 'dev' }}
          stage-list: stage0 stage1 stage2 ./image/stage-bouncer
          release: trixie
          pi-gen-version: arm64
          pi-gen-release: Bouncer
          hostname: bouncer
          locale: en_GB.UTF-8
          timezone: Europe/Brussels
          keyboard-keymap: us
          keyboard-layout: English (US)
          username: bouncer
          password: ${{ steps.pw.outputs.pw }}
          disable-first-boot-user-rename: 1
          enable-ssh: 0
          compression: xz
          compression-level: 6

      - name: Keep the image as a download (30 days)
        uses: actions/upload-artifact@v4
        with:
          name: bouncer-image
          path: ${{ steps.build.outputs.image-path }}
          retention-days: 30

      - name: Attach the image to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.build.outputs.image-path }}" --clobber
